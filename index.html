<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>Teknik Komputer Jaringan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f7;
  --kartu: #ffffff;
  --teks: #14213d;
  --teks-redup: #5b667a;
  --garis: #d6dde8;
  --aksen: #0056b3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1522;
    --kartu: #172033;
    --teks: #e8edf6;
    --teks-redup: #98a4ba;
    --garis: #2a3650;
    --aksen: #1d4ed8;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--teks);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
.wadah { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; justify-content: space-between; align-items: flex-start; }
header h1 { margin: 0 0 4px; font-size: 1.75rem; font-weight: 800; }
header p { margin: 0; color: var(--teks-redup); }
.btn-tambah {
  background: #0056b3;
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.9rem;
}
.btn-tambah:hover { background: #004085; }
.kontrol { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 8px; }
.kontrol input, .kontrol select {
  font: inherit;
  color: var(--teks);
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 10px;
  padding: 10px 12px;
}
.kontrol input { flex: 1 1 220px; }
.kontrol select { flex: 0 1 180px; }
.kontrol input:focus-visible, .kontrol select:focus-visible {
  outline: 2px solid var(--aksen);
  outline-offset: 1px;
}
.jumlah { color: var(--teks-redup); font-size: 0.9rem; margin: 0 0 16px; }
.daftar {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}
.kartu {
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pita { height: 60px; background: #007bff; }
.isi { padding: 0 16px 16px; text-align: center; flex: 1; display: flex; flex-direction: column; }
.foto {
  width: 76px; height: 76px;
  margin: -38px auto 8px;
  border-radius: 50%;
  border: 4px solid var(--kartu);
  background: #f3f4f6;
  color: #4b5563;
  display: grid; place-items: center; font-weight: 800; font-size: 1.5rem; overflow: hidden;
}
.foto img { width: 100%; height: 100%; object-fit: cover; }
.nama { margin: 0; font-size: 1.05rem; font-weight: 800; }
.nis { margin: 0 0 12px; color: var(--teks-redup); font-size: 0.85rem; }
.rincian { margin: 0 0 16px; text-align: left; font-size: 0.85rem; flex: 1; }
.rincian div {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 6px 0; border-top: 1px solid var(--garis);
}
.rincian dt { color: var(--teks-redup); }
.rincian dd { margin: 0; font-weight: 600; text-align: right; }
.aksi { display: flex; justify-content: center; gap: 8px; margin-top: auto; padding-top: 8px; }
.btn-edit, .btn-hapus {
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  color: #fff;
  font-weight: 600;
  font-size: 0.8rem;
  cursor: pointer;
}
.btn-edit { background: #d97706; }
.btn-edit:hover { background: #b45309; }
.btn-hapus { background: #dc2626; }
.btn-hapus:hover { background: #b91c1c; }
.pesan { grid-column: 1 / -1; text-align: center; padding: 40px 16px; color: var(--teks-redup); }
.pesan.galat { color: #b42318; }
@media (prefers-color-scheme: dark) { .pesan.galat { color: #ff8b80; } }
</style>
</head>
<body>
<div class="wadah">
  <header>
    <div>
      <h1>Teknik Komputer Jaringan</h1>
      <p>Cari berdasarkan role.</p>
    </div>
    <button class="btn-tambah">+ Tambah Data</button>
  </header>
  <div class="kontrol">
    <input id="cari" type="search" placeholder="Cari nama, NIS, atau NIP" aria-label="Cari nama, N
